<div *ngIf="loading" class="loading">Loading...</div>
<table *ngIf="!loading">
  <thead>
    <tr>
      <th *ngFor="let col of columns">
        {{ col.label }}
      </th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let row of data">
      <td *ngFor="let col of columns">
        <ng-container *ngIf="col.isBadge; else defaultCell">
          {{ row[col.key] }}
        </ng-container>
        <ng-template #defaultCell>
          {{ row[col.key] }}
        </ng-template>
      </td>
    </tr>
  </tbody>
</table>

<div *ngIf="!loading && data.length === 0" class="empty">No data found</div>
